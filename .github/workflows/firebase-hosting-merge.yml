name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ensure package-lock.json exists
        run: |
          if [ ! -f package-lock.json ]; then
            echo "package-lock.json not found in repository. Generating lockfile..."
            npm i --package-lock-only
          else
            echo "Found existing package-lock.json"
          fi

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node_modules-

      - name: Install dependencies using package-lock.json
        run: |
          if [ -f package-lock.json ]; then
            npm ci --prefer-offline || npm install
          else
            npm install
          fi

      - name: Build Next.js application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Verify Firebase Authentication Secret
        id: check-secret
        env:
          SA_SECRET: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_URBANDIRECTINTRACITY || secrets.FIREBASE_SERVICE_ACCOUNT || secrets.GCP_SA_KEY || secrets.FIREBASE_CREDENTIALS || secrets.GOOGLE_APPLICATION_CREDENTIALS || secrets.SERVICE_ACCOUNT_KEY }}
          TOKEN_SECRET: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -n "$SA_SECRET" ]; then
            echo "Deploying using Firebase Service Account."
            echo "AUTH_MODE=SERVICE_ACCOUNT" >> $GITHUB_ENV
          elif [ -n "$TOKEN_SECRET" ]; then
            echo "Deploying using FIREBASE_TOKEN CLI token."
            echo "AUTH_MODE=TOKEN" >> $GITHUB_ENV
          else
            echo "::error title=Missing Secret::No Firebase deployment secret was found in your GitHub repository Secrets. Please add 'FIREBASE_SERVICE_ACCOUNT_URBANDIRECTINTRACITY' (or 'FIREBASE_SERVICE_ACCOUNT') in GitHub under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Deploy via Firebase Action (Service Account)
        if: env.AUTH_MODE == 'SERVICE_ACCOUNT'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_URBANDIRECTINTRACITY || secrets.FIREBASE_SERVICE_ACCOUNT || secrets.GCP_SA_KEY || secrets.FIREBASE_CREDENTIALS || secrets.GOOGLE_APPLICATION_CREDENTIALS || secrets.SERVICE_ACCOUNT_KEY }}
          channelId: live
          projectId: urbandirectintracity

      - name: Deploy via Firebase CLI (Token)
        if: env.AUTH_MODE == 'TOKEN'
        run: npx firebase-tools deploy --only hosting --project urbandirectintracity --token "${{ secrets.FIREBASE_TOKEN }}" --non-interactive
