name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ensure package-lock.json exists
        run: |
          if [ ! -f package-lock.json ]; then
            echo "package-lock.json not found. Generating lockfile..."
            npm i --package-lock-only
          else
            echo "Found existing package-lock.json"
          fi

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node_modules-

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --prefer-offline || npm install
          else
            npm install
          fi

      - name: Run ESLint static analysis
        run: npm run lint

      - name: Run automated security and financial verification tests
        run: node --test scripts/audit-verification.test.mjs scripts/partner-program.test.mjs scripts/revenue-attribution-verification.test.mjs

      - name: Build Next.js application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Authenticate with Google Cloud
        id: auth
        env:
          SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_URBANDIRECTINTRACITY || secrets.FIREBASE_SERVICE_ACCOUNT || secrets.GCP_SA_KEY || secrets.FIREBASE_CREDENTIALS || secrets.GOOGLE_APPLICATION_CREDENTIALS || secrets.SERVICE_ACCOUNT_KEY }}
        run: |
          if [ -z "$SA_KEY" ] && [ -z "${{ secrets.FIREBASE_TOKEN }}" ]; then
            echo "::error title=Missing Secret::Please add 'FIREBASE_SERVICE_ACCOUNT_URBANDIRECTINTRACITY' or 'FIREBASE_TOKEN' to your GitHub repository secrets."
            exit 1
          fi
          if [ -n "$SA_KEY" ]; then
            echo "$SA_KEY" > "$RUNNER_TEMP/firebase_sa.json"
            echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase_sa.json" >> $GITHUB_ENV
            echo "AUTH_MODE=SERVICE_ACCOUNT" >> $GITHUB_ENV
          else
            echo "AUTH_MODE=TOKEN" >> $GITHUB_ENV
          fi

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks
          NPM_CONFIG_LEGACY_PEER_DEPS: 'true'
        run: |
          if [ "$AUTH_MODE" = "SERVICE_ACCOUNT" ]; then
            npx firebase-tools deploy --only hosting --project urbandirectintracity --force --debug --non-interactive
          else
            npx firebase-tools deploy --only hosting --project urbandirectintracity --token "${{ secrets.FIREBASE_TOKEN }}" --force --debug --non-interactive
          fi
