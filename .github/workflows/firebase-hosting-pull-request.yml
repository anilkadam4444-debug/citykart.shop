name: Deploy preview to Firebase Hosting on PR

on:
  pull_request:
    branches:
      - main
      - master

jobs:
  build_and_preview:
    if: '${{ github.event.pull_request.head.repo.full_name == github.repository }}'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ensure package-lock.json exists
        run: |
          if [ ! -f package-lock.json ]; then
            echo "package-lock.json not found in repository. Generating lockfile..."
            npm i --package-lock-only
          else
            echo "Found existing package-lock.json"
          fi

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node_modules-

      - name: Install dependencies using package-lock.json
        run: |
          if [ -f package-lock.json ]; then
            npm ci --prefer-offline || npm install
          else
            npm install
          fi

      - name: Run ESLint static analysis
        run: npm run lint

      - name: Run automated security and financial verification tests
        run: node --test scripts/audit-verification.test.mjs scripts/partner-program.test.mjs scripts/revenue-attribution-verification.test.mjs

      - name: Build Next.js application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Deploy to Firebase Hosting (Preview Channel)
        if: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_URBANDIRECTINTRACITY != '' || secrets.FIREBASE_SERVICE_ACCOUNT != '' || secrets.GCP_SA_KEY != '' || secrets.FIREBASE_CREDENTIALS != '' || secrets.SERVICE_ACCOUNT_KEY != '' }}"
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_URBANDIRECTINTRACITY || secrets.FIREBASE_SERVICE_ACCOUNT || secrets.GCP_SA_KEY || secrets.FIREBASE_CREDENTIALS || secrets.GOOGLE_APPLICATION_CREDENTIALS || secrets.SERVICE_ACCOUNT_KEY }}
          projectId: urbandirectintracity
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks
